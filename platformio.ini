; ayModbusConverter  -  Aysafi
; Conversor Modbus RTU (RS-485) <-> Modbus TCP sobre WT32-ETH01 (ESP32 + LAN8720).
;
; La WT32-ETH01 no trae USB: se programa con un adaptador USB-TTL 3V3 en
; TX0/RX0 (GPIO1/GPIO3) manteniendo IO0 a GND durante el reset.
; Despues de la primera carga, las siguientes se hacen por OTA (web o GitHub).

[env:wt32-eth01]
platform = espressif32
board = wt32-eth01
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; dual-OTA (app0/app1 de 1.9 MB). La UI va embebida en el firmware, no usa FS.
board_build.partitions = min_spiffs.csv
lib_deps =
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.6.1
	bblanchon/ArduinoJson @ ^7.0.4

; FW_VERSION_OVERRIDE lo inyecta el CI (.github/workflows/release.yml) desde el tag vX.Y.Z.
build_flags =
	-D CORE_DEBUG_LEVEL=0
	${sysenv.EXTRA_BUILD_FLAGS}
